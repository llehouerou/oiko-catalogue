# Checks the site's Docker output: the Dockerfile and compose.yaml it gives
# for no type of Bridge build the latest Oiko, and it serves its dashboard.
name: docker

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve the latest Oiko release
        id: oiko
        run: |
          version=$(curl -fsS https://proxy.golang.org/github.com/llehouerou/oiko/@latest | jq -r .Version)
          echo "Oiko $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write the Dockerfile and compose.yaml
        env:
          OIKO: ${{ steps.oiko.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/oiko/data"
          cd "$RUNNER_TEMP/oiko"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { compose, dockerfile } = await import(`${process.env.GITHUB_WORKSPACE}/site/catalogue.js`);
            const c = compose();
            const user = `user: "${process.getuid()}:${process.getgid()}"`;
            if (!c.includes("user: \"1000:1000\"")) throw new Error("no user");
            writeFileSync("Dockerfile", dockerfile([], process.env.OIKO));
            writeFileSync("compose.yaml", c.replace("user: \"1000:1000\"", user));
          '
          cat Dockerfile compose.yaml
      - name: Build and start Oiko
        working-directory: ${{ runner.temp }}/oiko
        run: docker compose up -d --build
      - name: Wait for its dashboard
        working-directory: ${{ runner.temp }}/oiko
        run: |
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs
          exit 1
