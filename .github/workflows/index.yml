# Indexes the types of Bridge into index.json (ADR 0020 of Oiko).
#
# Building and running a type executes code nobody reviewed: the job doing it
# may only read, and runs a built Oiko in a step given no token.
# Another job, which runs nothing of the types, validates the index it
# produced and commits it; a third publishes the site when it did.
name: index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every type, even against an Oiko it was built against
        type: boolean
        default: false

concurrency:
  group: index

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the indexer
        run: go build -o "$RUNNER_TEMP/oiko-catalogue" .
      - name: Find, resolve and build the types
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '-force' || '' }}
        run: |
          "$RUNNER_TEMP/oiko-catalogue" build -work "$RUNNER_TEMP/work" $FORCE
      - name: Check the types the builds register
        run: |
          "$RUNNER_TEMP/oiko-catalogue" check -work "$RUNNER_TEMP/work" -index "$RUNNER_TEMP/index.json"
      - uses: actions/upload-artifact@v7
        with:
          name: index
          path: ${{ runner.temp }}/index.json
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: index
          path: ${{ runner.temp }}/index
      - name: Validate the index
        run: go run . validate -index "$RUNNER_TEMP/index/index.json"
      - name: Commit it if it changed
        id: commit
        run: |
          cp "$RUNNER_TEMP/index/index.json" index.json
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Index the types of Bridge"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: commit
    if: needs.commit.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
